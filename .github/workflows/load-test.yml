name: Load Test

# Required secrets (azure stage only):
#   AZURE_CREDENTIALS     – service principal JSON ({ clientId, clientSecret, subscriptionId, tenantId })
#   AZURE_RESOURCE_GROUP  – resource group to deploy the container into
#   ACR_LOGIN_SERVER      – ACR login server, e.g. myregistry.azurecr.io
#   ACR_USERNAME          – ACR username (or service principal client ID with AcrPush role)
#   ACR_PASSWORD          – ACR password (or service principal client secret)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment target
        required: true
        default: pipeline
        type: choice
        options:
          - pipeline
          - azure
      simulation:
        description: Gatling simulation to run
        required: true
        default: BookBrowsingV1Simulation
        type: choice
        options:
          - BookBrowsingV1Simulation
          - BookBrowsingV2Simulation

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # --- Pipeline stage ---
      - name: Build backend JAR
        if: inputs.stage == 'pipeline'
        run: ./gradlew :backend:bootJar --no-daemon

      - name: Start backend
        if: inputs.stage == 'pipeline'
        run: nohup java -jar backend/build/libs/*.jar > backend.log 2>&1 &

      # --- Azure stage ---
      - name: Log in to Azure
        if: inputs.stage == 'azure'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        if: inputs.stage == 'azure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: inputs.stage == 'azure'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image to ACR
        if: inputs.stage == 'azure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/oas-demo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Instances
        if: inputs.stage == 'azure'
        run: |
          az container create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "oas-demo-${{ github.run_number }}" \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/oas-demo-backend:${{ github.sha }}" \
            --registry-login-server "${{ secrets.ACR_LOGIN_SERVER }}" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --dns-name-label "oas-demo-${{ github.run_number }}" \
            --ports 8080 \
            --cpu 1 \
            --memory 1.5 \
            --os-type Linux

      # --- Resolve backend URL for both stages ---
      - name: Resolve backend URL
        id: backend
        shell: bash
        run: |
          if [[ "${{ inputs.stage }}" == "azure" ]]; then
            FQDN=$(az container show \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "oas-demo-${{ github.run_number }}" \
              --query ipAddress.fqdn \
              --output tsv)
            echo "base_url=http://$FQDN:8080" >> $GITHUB_OUTPUT
          else
            echo "base_url=http://localhost:8080" >> $GITHUB_OUTPUT
          fi

      - name: Run Gatling tests
        uses: ./.github/actions/run-gatling
        with:
          base_url: ${{ steps.backend.outputs.base_url }}
          simulation: ${{ inputs.simulation }}

      # --- Azure cleanup (always runs to avoid orphaned containers) ---
      - name: Delete container instance
        if: always() && inputs.stage == 'azure'
        run: |
          az container delete \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "oas-demo-${{ github.run_number }}" \
            --yes
