name: Load Test

on:
  workflow_dispatch:
    inputs:
      simulation:
        description: Gatling simulation to run
        required: true
        default: BookBrowsingV1Simulation
        type: choice
        options:
          - BookBrowsingV1Simulation
          - BookBrowsingV2Simulation

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Start backend
        run: docker compose up -d --build

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on http://localhost:8080 ..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/books > /dev/null; do
            echo "  not ready yet, retrying in 3s"
            sleep 3
          done'
          echo "Backend is ready"

      - name: Run Gatling simulation
        env:
          GATLING_BASE_URL: http://localhost:8080
        run: |
          ./gradlew \
            :gatling-tests:gatlingRun-org.example.gatling.scenarios.${{ github.event.inputs.simulation }} \
            --no-daemon

      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report-${{ github.event.inputs.simulation }}-${{ github.run_number }}
          path: gatling-tests/build/reports/gatling/
          retention-days: 30

      - name: Shut down environment
        if: always()
        run: docker compose down
