name: Load Test (Pipeline)

on:
  workflow_dispatch:
    inputs:
      simulation:
        description: Gatling simulation to run
        required: true
        default: BookBrowsingV1Simulation
        type: choice
        options:
          - BookBrowsingV1Simulation
          - BookBrowsingV2Simulation

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build backend JAR
        run: ./gradlew :backend:bootJar --no-daemon

      - name: Start backend
        run: nohup java -jar backend/build/libs/*.jar > backend.log 2>&1 &

      - name: Run Gatling tests
        uses: ./.github/actions/run-gatling
        with:
          base_url: http://localhost:8080
          simulation: ${{ github.event.inputs.simulation }}
